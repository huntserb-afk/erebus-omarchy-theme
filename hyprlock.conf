# EREBUS — Primordial Darkness
# Omarchy Hyprlock

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 4
    brightness = 0.35
}

input-field {
    monitor =
    size = 320, 55
    outline_thickness = 2

    outer_color = rgb(8B1E24)
    inner_color = rgb(111315)

    font_color = rgb(D6D3CE)

    fade_on_empty = false
    placeholder_text = <span foreground="##77746F">Enter password...</span>

    rounding = 3
}

label {
    monitor =
    text = $TIME
    color = rgb(D6D3CE)
    font_size = 64
    font_family = JetBrains Mono
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = EREBUS
    color = rgb(8B1E24)
    font_size = 20
    font_family = JetBrains Mono
    position = 0, 40
    halign = center
    valign = center
}
